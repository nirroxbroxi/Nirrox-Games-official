<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nirrox Games - Site Officiel</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-card {
      background: rgba(18, 18, 22, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .shadow-glow-indigo {
      box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.4);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col pb-20 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white" data-page="biblio">

  <!-- En-tête / Header Navigation -->
  <header class="sticky top-0 z-50 bg-black/60 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
      
      <!-- Logo -->
      <div onclick="changerPage('biblio')" class="flex items-center gap-3 cursor-pointer group">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center font-black text-white text-lg shadow-glow-indigo group-hover:scale-105 transition">
          N
        </div>
        <span class="font-black text-lg tracking-tight text-white group-hover:text-indigo-400 transition">
          Nirrox Games
        </span>
      </div>

      <!-- Navigation Bar -->
      <nav class="flex items-center gap-1 bg-white/5 p-1 rounded-2xl border border-white/10">
        <button id="nav-biblio" onclick="changerPage('biblio')" class="px-4 py-2 rounded-xl text-xs font-extrabold transition bg-white/10 text-white">
          <i class="fa-solid fa-gamepad mr-1.5"></i> Bibliothèque
        </button>
        <button id="nav-apps" onclick="changerPage('apps')" class="px-4 py-2 rounded-xl text-xs font-extrabold text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-laptop-code mr-1.5"></i> Launcher Chromebook
        </button>
        <button id="nav-apropos" onclick="changerPage('apropos')" class="px-4 py-2 rounded-xl text-xs font-extrabold text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-circle-info mr-1.5"></i> À propos
        </button>
      </nav>

      <!-- Badge Chromebook -->
      <div class="hidden md:flex items-center gap-2 bg-indigo-950/60 border border-indigo-500/30 px-3.5 py-1.5 rounded-full text-xs font-bold text-indigo-300">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        Optimisé ChromeOS
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-6xl mx-auto px-6 py-8 flex-1 w-full">

    <!-- Section Unique : Bibliothèque de jeux -->
    <section id="view-biblio" class="space-y-8">
      
      <!-- Bannière Hero Simple -->
      <div class="glass-card rounded-3xl p-8 md:p-10 relative overflow-hidden flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border border-white/10">
        <div class="space-y-2 z-10 max-w-xl">
          <span class="text-xs font-black uppercase tracking-widest text-indigo-400">Plateforme de Jeux HTML5</span>
          <h1 class="text-3xl md:text-4xl font-black text-white tracking-tight leading-tight">
            Sélectionne un jeu et <span class="bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">joue immédiatement.</span>
          </h1>
          <p class="text-sm text-slate-400">
            Tous les jeux HTML ajoutés dans le dossier <code class="text-indigo-300 bg-indigo-950/80 px-2 py-0.5 rounded font-mono">/Jeux/</code> s'affichent automatiquement ici.
          </p>
        </div>

        <div class="flex items-center gap-4 z-10">
          <button onclick="chargerJeuxDossier()" class="px-5 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs transition flex items-center gap-2 shadow-glow-indigo">
            <i class="fa-solid fa-rotate"></i> Actualiser les jeux
          </button>
        </div>
      </div>

      <!-- Header Catalogue -->
      <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <h2 class="text-xl font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-gamepad text-indigo-400"></i> Vos Jeux Disponibles
        </h2>
        <span class="text-xs font-bold text-slate-400" id="jeux-count">
          0 jeu détecté
        </span>
      </div>

      <!-- Grille des jeux -->
      <div id="games-grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Les cartes de jeux sont injectées par JavaScript -->
      </div>
    </section>

  </main>

  <!-- Modale d'Exécution de Jeu -->
  <div id="modal-game" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card rounded-3xl w-full max-w-5xl overflow-hidden border border-white/10 flex flex-col max-h-[90vh]">
      <div class="p-4 border-b border-white/10 flex items-center justify-between bg-black/40">
        <h3 id="game-modal-title" class="font-black text-white text-lg">Jeu</h3>
        <button onclick="fermerJeu()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="game-canvas-container" class="p-2 flex-1 bg-black min-h-[500px]">
        <!-- Iframe dynamiquement injectée -->
      </div>
    </div>
  </div>

  <script>
    // Identifiants GitHub pour scanner le dossier /Jeux/
    const GITHUB_REPO_OWNER = "TonPseudoGitHub"; // Mets ton pseudo GitHub
    const GITHUB_REPO_NAME = "NirroxGames";      // Mets le nom de ton dépôt

    let catalogueJeux = [];

    async function chargerJeuxDossier() {
      catalogueJeux = [];
      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/contents/Jeux`;
        const res = await fetch(apiUrl);
        
        if (res.ok) {
          const files = await res.json();
          const htmlFiles = files.filter(file => file.name.endsWith('.html'));

          if (htmlFiles.length > 0) {
            catalogueJeux = htmlFiles.map((file, idx) => {
              const cleanName = file.name.replace('.html', '').replace(/[-_]/g, ' ');
              const formattedTitle = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
              
              return {
                id: `game-${idx}`,
                titre: formattedTitle,
                fichier: `Jeux/${file.name}`,
                nomFichier: file.name
              };
            });
          }
        }
      } catch (err) {
        console.warn("Scan GitHub API en attente de configuration", err);
      }

      // Si le scan API n'a pas encore de réponse, on s'assure d'inclure ultra.html et le dossier local
      if (catalogueJeux.length === 0) {
        catalogueJeux = [
          {
            id: 'ultra-game',
            titre: 'Ultra',
            fichier: 'Jeux/ultra.html',
            nomFichier: 'ultra.html'
          }
        ];
      }

      afficherBibliotheque();
    }

    function afficherBibliotheque() {
      const container = document.getElementById("games-grid-container");
      const countEl = document.getElementById("jeux-count");
      if (!container) return;

      if (countEl) countEl.textContent = `${catalogueJeux.length} jeu(x) disponible(s)`;

      if (catalogueJeux.length === 0) {
        container.innerHTML = `
          <div class="col-span-full p-12 text-center glass-card rounded-3xl border border-dashed border-white/10 space-y-4">
            <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center mx-auto text-2xl">
              <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="text-xl font-bold text-white">Aucun fichier HTML trouvé dans /Jeux/</h3>
            <p class="text-xs text-slate-400 max-w-md mx-auto leading-relaxed">
              Déposez vos jeux (ex: <code>ultra.html</code>) dans le dossier <strong>/Jeux/</strong> sur votre GitHub.
            </p>
          </div>
        `;
        return;
      }

      const couleursBadge = [
        'from-indigo-600 to-indigo-900',
        'from-purple-600 to-purple-900',
        'from-blue-600 to-blue-900',
        'from-emerald-600 to-emerald-900'
      ];

      container.innerHTML = catalogueJeux.map((jeu, idx) => {
        const bgGrad = couleursBadge[idx % couleursBadge.length];
        return `
        <div class="glass-card rounded-3xl overflow-hidden flex flex-col group relative border border-white/10 hover:border-indigo-500/40 transition duration-300">
          <div class="h-40 bg-gradient-to-tr ${bgGrad} relative p-6 flex flex-col justify-between overflow-hidden">
            <div class="flex items-center justify-between z-10">
              <span class="bg-black/40 backdrop-blur-md border border-white/10 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider">
                Jeu HTML5
              </span>
              <span class="text-[11px] font-mono text-white/70 bg-black/30 px-2 py-0.5 rounded">
                ${jeu.nomFichier}
              </span>
            </div>
            <i class="fa-solid fa-gamepad text-6xl text-white/10 absolute -bottom-2 -right-2 group-hover:scale-125 transition duration-500"></i>
            <h3 class="font-black text-2xl text-white z-10 drop-shadow-md">${jeu.titre}</h3>
          </div>
          
          <div class="p-6 flex-1 flex flex-col justify-between space-y-4">
            <p class="text-xs text-slate-400">Lancement instantané du fichier <code class="text-indigo-300">${jeu.fichier}</code> dans le launcher.</p>

            <button onclick="lancerFichierJeu('${jeu.fichier}', '${jeu.titre}')" class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs transition uppercase tracking-wider flex items-center justify-center gap-2 shadow-glow-indigo">
              <i class="fa-solid fa-play"></i> Lancer le jeu
            </button>
          </div>
        </div>
      `}).join('');
    }

    function lancerFichierJeu(urlFichier, titre) {
      const title = document.getElementById("game-modal-title");
      const container = document.getElementById("game-canvas-container");
      if (title) title.textContent = titre;

      if (container) {
        container.innerHTML = `<iframe src="${urlFichier}" class="w-full h-full min-h-[550px] rounded-2xl border-0" allow="fullscreen"></iframe>`;
      }

      const modal = document.getElementById("modal-game");
      if (modal) modal.classList.remove("hidden");
    }

    function fermerJeu() {
      const container = document.getElementById("game-canvas-container");
      if (container) container.innerHTML = '';
      const modal = document.getElementById("modal-game");
      if (modal) modal.classList.add("hidden");
    }

    document.addEventListener("DOMContentLoaded", () => {
      chargerJeuxDossier();
    });
  </script>
</body>
</html>
