<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Games Hub - Plateforme de Jeux</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
              950: '#09090b',
            }
          },
          boxShadow: {
            'glow-indigo': '0 0 25px -5px rgba(99, 102, 241, 0.4)',
          }
        }
      }
    }
  </script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #09090b;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
    }

    .glass-card {
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-12 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- En-tête / Header -->
  <header class="sticky top-0 z-50 bg-black/60 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
      
      <!-- Logo -->
      <div class="flex items-center gap-3 group">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center font-black text-white text-lg shadow-glow-indigo">
          N
        </div>
        <span class="font-black text-lg tracking-tight text-white">
          Nirrox Games
        </span>
      </div>

      <!-- Badge Info -->
      <div class="flex items-center gap-2 bg-indigo-950/60 border border-indigo-500/30 px-3.5 py-1.5 rounded-full text-xs font-bold text-indigo-300">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        Plateforme de Jeux HTML5
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-6xl mx-auto px-6 py-8 flex-1 w-full">

    <!-- Section Unique : Bibliothèque de jeux -->
    <section id="view-biblio" class="space-y-8">
      
      <!-- Bannière Hero -->
      <div class="glass-card rounded-3xl p-8 md:p-10 relative overflow-hidden flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border border-white/10">
        <div class="space-y-2 z-10 max-w-xl">
          <span class="text-xs font-black uppercase tracking-widest text-indigo-400">Bibliothèque</span>
          <h1 class="text-3xl md:text-4xl font-black text-white tracking-tight leading-tight">
            Sélectionne un jeu et <span class="bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">joue immédiatement.</span>
          </h1>
          <p class="text-sm text-slate-400">
            Tous les fichiers du dossier <code class="text-indigo-300 bg-indigo-950/80 px-2 py-0.5 rounded font-mono">/Jeux/</code> s'affichent automatiquement ici.
          </p>
        </div>

        <div class="flex items-center gap-4 z-10">
          <button onclick="chargerJeuxDossier()" class="px-5 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs transition flex items-center gap-2 shadow-glow-indigo">
            <i class="fa-solid fa-rotate"></i> Actualiser les jeux
          </button>
        </div>
      </div>

      <!-- Header Catalogue -->
      <div class="flex items-center justify-between border-b border-white/10 pb-4">
        <h2 class="text-xl font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-gamepad text-indigo-400"></i> Vos Jeux Disponibles
        </h2>
        <span class="text-xs font-bold text-slate-400" id="jeux-count">
          0 jeu détecté
        </span>
      </div>

      <!-- Grille des jeux -->
      <div id="games-grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Les cartes de jeux sont injectées par le script app.js -->
      </div>
    </section>

  </main>

  <!-- Modale d'Exécution de Jeu Plein Écran Ajusté -->
  <div id="modal-game" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-2 md:p-6">
    <div class="glass-card rounded-2xl md:rounded-3xl w-full h-full max-w-6xl max-h-[95vh] overflow-hidden border border-white/10 flex flex-col shadow-2xl">
      <div class="px-5 py-3 border-b border-white/10 flex items-center justify-between bg-black/60">
        <div class="flex items-center gap-3">
          <span class="w-3 h-3 rounded-full bg-indigo-500"></span>
          <h3 id="game-modal-title" class="font-black text-white text-base md:text-lg">Jeu</h3>
        </div>
        <button onclick="fermerJeu()" class="w-9 h-9 rounded-xl bg-white/10 hover:bg-red-500/80 text-white flex items-center justify-center transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <!-- Container Responsive Iframe -->
      <div id="game-canvas-container" class="w-full flex-1 bg-black relative overflow-hidden">
        <!-- Iframe dynamiquement injectée -->
      </div>
    </div>
  </div>

  <!-- Chargement du fichier JavaScript externe -->
  <script src="app.js"></script>
</body>
</html>
